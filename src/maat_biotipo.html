<title>MAAT &mdash; Descubre tu Biotipo</title>
<meta name="description" content="Un cuestionario de autoconocimiento para descubrir tu biotipo principal y tu segundo dominante: c&oacute;mo piensas, c&oacute;mo habitas tu cuerpo y qu&eacute; procesos te toca integrar.">

<style>
:root{
  --c:#39A1C9; --o:#EBA055; --m:#7DCD93; --v:#896C8E; --r:#D76B6E;
  --paper:#fdfaf6; --paper2:#f5efe6;
  --ink:#2a2030; --ink2:#5a4f5e; --mu:#8a7d8c;
  --bd:rgba(42,32,48,0.10);
  --shadow:0 8px 30px rgba(42,32,48,0.08);
  --shadow-lg:0 20px 60px rgba(42,32,48,0.12);
  --radius:18px; --radius-sm:12px;
  --font-title:'Saira Condensed',sans-serif;
  --font-body:'Sora',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font-body);background:var(--paper);color:var(--ink);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
img{max-width:100%;height:auto;display:block;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
.wrap{max-width:680px;margin:0 auto;padding:20px 20px 80px;min-height:100vh;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 0 20px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand img{width:40px;height:40px;border-radius:10px;box-shadow:var(--shadow);}
.brand span{font-family:var(--font-title);font-weight:700;letter-spacing:3px;font-size:18px;text-transform:uppercase;}
.lang-toggle{display:flex;gap:2px;background:var(--paper2);border-radius:20px;padding:3px;}
.lang-toggle button{padding:5px 12px;border-radius:16px;font-size:13px;font-weight:600;color:var(--mu);}
.lang-toggle button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow);}

/* INTRO */
.intro{text-align:center;padding:24px 6px;}
.intro .eyebrow{font-family:var(--font-title);font-size:14px;font-weight:700;letter-spacing:4px;color:var(--v);text-transform:uppercase;margin-bottom:16px;}
.intro h1{font-family:var(--font-title);font-size:clamp(34px,8vw,54px);font-weight:700;line-height:1.05;margin-bottom:18px;letter-spacing:-.5px;}
.intro h1 em{font-style:italic;color:var(--v);}
.intro p{color:var(--ink2);font-size:17px;max-width:520px;margin:0 auto 14px;line-height:1.7;}
.intro .meta-note{font-size:14px;color:var(--mu);margin-top:8px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:26px 0;}
.chip{padding:7px 14px;border-radius:20px;font-size:13px;font-weight:600;background:#fff;box-shadow:var(--shadow);}
.btn-primary{display:inline-block;background:var(--v);color:#fff;font-weight:600;font-size:17px;padding:15px 40px;border-radius:30px;box-shadow:var(--shadow-lg);transition:transform .15s,box-shadow .15s;margin-top:12px;}
.btn-primary:active{transform:translateY(1px);}
.btn-ghost{display:inline-block;color:var(--v);font-weight:600;font-size:15px;padding:12px 24px;border-radius:24px;border:1.5px solid var(--bd);}

/* CAPA CONTENEDORA DE IMAGEN (papercut) */
.hero-illo{position:relative;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-lg);min-height:230px;display:flex;align-items:flex-end;isolation:isolate;}
.hero-illo .illo-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%;z-index:0;}
.hero-illo .illo-scrim{position:absolute;inset:0;z-index:1;pointer-events:none;}
.hero-illo .illo-content{position:relative;z-index:2;width:100%;padding:26px 24px 24px;color:#fff;text-align:center;}
.hero-illo .illo-content .eyebrow{font-family:var(--font-title);font-size:13px;font-weight:700;letter-spacing:4px;text-transform:uppercase;margin-bottom:10px;color:rgba(255,255,255,.92);text-shadow:0 1px 8px rgba(42,32,48,.35);}
.hero-illo .illo-content h1{font-family:var(--font-title);font-size:clamp(34px,9vw,56px);font-weight:700;line-height:1.02;letter-spacing:-.5px;color:#fff;text-shadow:0 2px 14px rgba(42,32,48,.35);}
.hero-illo .illo-content h1 em{font-style:italic;color:#fff;}
.hero-illo .illo-content .poetic{font-style:italic;font-size:18px;margin-top:8px;color:rgba(255,255,255,.94);text-shadow:0 1px 8px rgba(42,32,48,.3);}
.hero-illo .illo-content .second{font-size:15px;margin-top:12px;color:rgba(255,255,255,.88);text-shadow:0 1px 8px rgba(42,32,48,.3);}
.hero-illo .illo-content .second b{color:#fff;}
.intro-hero{margin-bottom:22px;min-height:210px;}
.result-hero{margin-bottom:22px;}
.illo-badge{width:64px;height:64px;border-radius:16px;object-fit:cover;margin:0 auto 12px;display:block;box-shadow:0 6px 20px rgba(42,32,48,.28);border:2px solid rgba(255,255,255,.6);background:#fff;}

/* QUIZ */
.progress{height:6px;background:var(--paper2);border-radius:6px;overflow:hidden;margin:6px 0 4px;}
.progress-fill{height:100%;background:var(--v);border-radius:6px;transition:width .3s;}
.progress-label{font-size:13px;color:var(--mu);text-align:center;margin-bottom:26px;font-weight:600;}
.q-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:34px 26px;text-align:center;animation:fade .3s ease;}
@keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.q-num{font-family:var(--font-title);font-size:15px;font-weight:700;letter-spacing:2px;color:var(--v);margin-bottom:14px;}
.q-text{font-size:22px;font-weight:500;line-height:1.4;margin-bottom:30px;min-height:62px;display:flex;align-items:center;justify-content:center;}
.scale{display:flex;gap:8px;justify-content:center;align-items:stretch;margin-bottom:16px;}
.scale button{flex:1;max-width:64px;aspect-ratio:1/1;border-radius:14px;background:var(--paper2);font-family:var(--font-title);font-size:22px;font-weight:700;color:var(--ink2);transition:transform .12s,background .12s,color .12s;display:flex;align-items:center;justify-content:center;}
.scale button:hover{background:#efe7db;}
.scale button.sel{background:var(--v);color:#fff;transform:scale(1.06);}
.scale-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);margin-bottom:8px;padding:0 2px;}
.q-nav{display:flex;justify-content:center;margin-top:22px;}
.q-back{font-size:14px;color:var(--mu);font-weight:600;padding:8px 18px;}

/* RESULT */
.res-head{text-align:center;padding:10px 0 4px;}
.res-head .eyebrow{font-family:var(--font-title);font-size:13px;font-weight:700;letter-spacing:4px;text-transform:uppercase;margin-bottom:10px;}
.res-head h1{font-family:var(--font-title);font-size:clamp(38px,10vw,62px);font-weight:700;line-height:1;letter-spacing:-.5px;}
.res-head .poetic{font-style:italic;color:var(--ink2);font-size:18px;margin-top:8px;}
.res-head .second{font-size:15px;color:var(--mu);margin-top:10px;}
.res-head .second b{color:var(--ink);}
.blend-note{background:#fff;border-radius:var(--radius-sm);box-shadow:var(--shadow);padding:12px 18px;font-size:14px;color:var(--ink2);margin:18px auto 0;max-width:440px;text-align:center;}

/* Seleccion de modo (intro) */
.mode-cards{display:flex;flex-direction:column;gap:12px;margin:22px 0 10px;text-align:left;}
.mode-card{background:#fff;border:1.5px solid var(--bd);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s;width:100%;}
.mode-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);}
.mode-card.mode-primary{border-color:var(--v);background:linear-gradient(135deg,rgba(137,108,142,.08),#fff);}
.mode-title{font-family:var(--font-title);font-size:22px;font-weight:700;color:var(--ink);}
.mode-sub{font-size:14px;color:var(--ink2);line-height:1.55;margin:4px 0 8px;}
.mode-meta{font-size:12px;font-weight:600;color:var(--v);letter-spacing:.3px;}
/* Bloque/seccion dentro del quiz */
.q-block{font-family:var(--font-title);font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--v);margin-bottom:8px;}
/* Desglose por dimension */
.dim-block{margin:6px 0 8px;}
.dim-h{font-family:var(--font-title);font-size:15px;letter-spacing:2px;text-transform:uppercase;color:var(--mu);text-align:center;font-weight:700;margin-bottom:6px;}
.dim-intro{font-size:14px;color:var(--ink2);text-align:center;max-width:460px;margin:0 auto 16px;line-height:1.6;}
.dim-card{background:#fff;border-radius:var(--radius-sm);box-shadow:var(--shadow);padding:14px 18px;margin-bottom:10px;}
.dim-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;}
.dim-name{font-family:var(--font-title);font-size:17px;font-weight:700;color:var(--ink);}
.dim-sub{font-size:12px;color:var(--mu);}
.dim-lead{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:15px;}
.dim-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.dim-pct{color:var(--mu);font-size:13px;font-variant-numeric:tabular-nums;margin-left:2px;}
.dim-prelim{font-size:12px;color:var(--mu);font-style:italic;margin-top:8px;line-height:1.5;}

.spectrum{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 22px 14px;margin:26px 0;}
.spectrum h3{font-family:var(--font-title);font-size:15px;letter-spacing:2px;text-transform:uppercase;color:var(--mu);margin-bottom:16px;text-align:center;font-weight:700;}
.bar-row{margin-bottom:14px;}
.bar-top{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:5px;}
.bar-top .pct{color:var(--mu);font-variant-numeric:tabular-nums;}
.bar-track{height:12px;background:var(--paper2);border-radius:8px;overflow:hidden;}
.bar-fill{height:100%;border-radius:8px;transition:width .8s cubic-bezier(.2,.8,.2,1);}

.section{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:24px 24px;margin-bottom:16px;}
.section h2{font-family:var(--font-title);font-size:22px;font-weight:700;letter-spacing:.3px;margin-bottom:12px;display:flex;align-items:center;gap:10px;}
.section h2 .dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
.section p{color:var(--ink2);line-height:1.7;font-size:15.5px;}
.section.esencia{border-left:4px solid var(--v);}
.matiz{background:var(--paper2);border-radius:var(--radius);padding:22px 24px;margin-bottom:16px;}
.matiz h2{font-family:var(--font-title);font-size:20px;font-weight:700;margin-bottom:10px;}
.matiz p{color:var(--ink2);line-height:1.7;font-size:15.5px;}
.synergy{text-align:center;font-size:17px;color:var(--ink);font-style:italic;line-height:1.6;padding:24px 20px;max-width:520px;margin:0 auto 8px;}

.cta-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:26px 24px;text-align:center;margin:24px 0 8px;}
.cta-card h3{font-family:var(--font-title);font-size:24px;font-weight:700;margin-bottom:8px;}
.cta-card p{color:var(--ink2);font-size:15px;margin-bottom:18px;line-height:1.6;}
.field{display:flex;flex-direction:column;gap:10px;max-width:380px;margin:0 auto;}
.field input{width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid var(--bd);background:var(--paper);font-family:inherit;font-size:15px;color:var(--ink);}
.field input:focus{outline:none;border-color:var(--v);}
.saved-badge{display:inline-flex;align-items:center;gap:8px;background:var(--m);color:#fff;font-weight:600;padding:12px 22px;border-radius:24px;font-size:15px;}
.res-actions{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:20px;}
.disclaimer{text-align:center;font-size:12.5px;color:var(--mu);margin-top:30px;line-height:1.6;max-width:460px;margin-left:auto;margin-right:auto;}
.hidden{display:none!important;}
.spin{display:inline-block;width:34px;height:34px;border:3px solid var(--paper2);border-top-color:var(--v);border-radius:50%;animation:rot .7s linear infinite;}
@keyframes rot{to{transform:rotate(360deg);}}
.loading{text-align:center;padding:80px 0;}
.err-msg{color:var(--r);font-size:14px;margin-top:10px;font-weight:600;}
</style>
</head>

function buildItems(m){

}

// Puntaje: por dimension (proporcion entre biotipos) y agregado ponderado.
function computeScores(items,ans){
  const dims={};
  items.forEach((it,i)=>{
    const d=it.dim,t=it.t,v=ans[i]||0;
    if(!dims[d]){dims[d]={sum:{s:0,c:0,m:0,f:0},n:{s:0,c:0,m:0,f:0}};}
    dims[d].sum[t]+=v; dims[d].n[t]++;
  });
  const dimResult={}; const overall={s:0,c:0,m:0,f:0}; let wsum=0;
  for(const d in dims){
    // Promedio por biotipo (no suma): evita que un biotipo con mas items en la
    // dimension quede inflado si el numero de items no esta balanceado.
    const mean={}; ORDER.forEach(t=>mean[t]=dims[d].n[t]?dims[d].sum[t]/dims[d].n[t]:0);
    const tot=ORDER.reduce((a,t)=>a+mean[t],0)||1;
    const props={}; ORDER.forEach(t=>props[t]=mean[t]/tot);
    const rank=ORDER.slice().sort((a,b)=>props[b]-props[a]);
    dimResult[d]={props,lead:rank[0]};
    const w=DIM_WEIGHT[d]||0; wsum+=w;
    ORDER.forEach(t=>overall[t]+=w*props[t]);
  }
  ORDER.forEach(t=>overall[t]=overall[t]/(wsum||1));
  const maxp=Math.max(...ORDER.map(t=>overall[t]))||1;
  const scores={}; ORDER.forEach(t=>scores[t]=Math.round(overall[t]/maxp*100));
  return {scores,dims:dimResult};
}

// Radar (arana) SVG de los 4 biotipos. s=arriba, c=derecha, m=abajo, f=izquierda.
function radarSVG(scores){
  const W=380,H=300,cx=W/2,cy=H/2,R=98;
  const pts=ORDER.map((t,i)=>{
    const a=-Math.PI/2+i*Math.PI/2;
    const r=Math.max(0.05,(scores[t]||0)/100)*R;
    return{t,a,hex:BIOS[t].hex,name:BIOS[t].name[lang],
      x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r,
      ax:cx+Math.cos(a)*R,ay:cy+Math.sin(a)*R};
  });
  let rings="";[0.25,0.5,0.75,1].forEach(fr=>{
    const p=ORDER.map((t,i)=>{const a=-Math.PI/2+i*Math.PI/2;return(cx+Math.cos(a)*R*fr).toFixed(1)+","+(cy+Math.sin(a)*R*fr).toFixed(1);}).join(" ");
    rings+=`<polygon points="${p}" fill="none" stroke="#e6ddd0" stroke-width="1"/>`;
  });
  const axes=pts.map(p=>`<line x1="${cx}" y1="${cy}" x2="${p.ax.toFixed(1)}" y2="${p.ay.toFixed(1)}" stroke="#e6ddd0" stroke-width="1"/>`).join("");
  const shape=pts.map(p=>p.x.toFixed(1)+","+p.y.toFixed(1)).join(" ");
  const verts=pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4.5" fill="${p.hex}"/>`).join("");
  const labels=pts.map(p=>{
    const lx=cx+Math.cos(p.a)*(R+16),ly=cy+Math.sin(p.a)*(R+16);
    const anchor=Math.abs(Math.cos(p.a))<0.3?"middle":(Math.cos(p.a)>0?"start":"end");
    return `<text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="13" font-weight="700" fill="${p.hex}">${p.name}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:360px;margin:0 auto;display:block;" role="img" aria-label="Radar biotipos">
    ${rings}${axes}
    <polygon points="${shape}" fill="rgba(137,108,142,.18)" stroke="var(--v)" stroke-width="2.5" stroke-linejoin="round"/>
    ${verts}${labels}</svg>`;
}

        <div class="eyebrow">${T("eyebrow")}</div>
        <h1>${T("title")}</h1>
      </div>
    </div>
    <div class="intro">
      <p>${T("intro1")}</p>
      <div class="mode-cards">
        <button class="mode-card mode-primary" onclick="startQuiz('complete')">
          <div class="mode-title">${T("modeCompleteTitle")}</div>
          <div class="mode-sub">${T("modeCompleteSub")}</div>
          <div class="mode-meta">${T("modeCompleteMeta")}</div>
        </button>
        <button class="mode-card" onclick="startQuiz('short')">
          <div class="mode-title">${T("modeShortTitle")}</div>
          <div class="mode-sub">${T("modeShortSub")}</div>
          <div class="mode-meta">${T("modeShortMeta")}</div>
        </button>
      </div>
      ${saved?`<div><button class="btn-ghost" onclick="showSaved()">${T("resume")}</button></div>`:""}
      <p class="meta-note">${T("metaNote")}</p>
    </div>`;
}

function startQuiz(m){
  mode=(m==="short")?"short":"complete";
  activeItems=buildItems(mode);
  idx=0; answers=new Array(activeItems.length).fill(0);
  screen="quiz"; renderQuiz();
}

/* ---- QUIZ ---- */
function renderQuiz(){
  screen="quiz";
  const it=activeItems[idx];
  const pct=Math.round((idx)/activeItems.length*100);
  const cur=answers[idx];
  let scaleBtns="";
  for(let v=1;v<=5;v++){
    scaleBtns+=`<button class="${cur===v?"sel":""}" onclick="answer(${v})">${v}</button>`;
  }
  const dim=DIM_LABEL[it.dim];
  const block=(mode==="complete"&&dim)?`<div class="q-block">${T("blockOf")}: ${dim[lang]}</div>`:"";
  app.innerHTML=`
    <div class="progress"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label">${idx+1} ${T("qOf")} ${activeItems.length}</div>
    <div class="q-card">
      ${block}
      <div class="q-num">${idx+1}</div>
      <div class="q-text">${it[lang]}</div>
      <div class="scale-ends"><span>${T("endLow")}</span><span>${T("endHigh")}</span></div>
      <div class="scale">${scaleBtns}</div>
      <div class="q-nav">${idx>0?`<button class="q-back" onclick="prevQ()">&#8592; ${T("back")}</button>`:""}</div>
    </div>`;
}
function answer(v){
  answers[idx]=v;
  setTimeout(()=>{
    if(idx<activeItems.length-1){idx++;renderQuiz();}
    else compute();
  },180);
}
function prevQ(){ if(idx>0){idx--;renderQuiz();} }

/* ---- C\u00f3mputo ---- */
function compute(){
  screen="computing";
  app.innerHTML=`<div class="loading"><div class="spin"></div><p style="margin-top:18px;color:var(--mu);">${T("computing")}</p></div>`;
  const cs=computeScores(activeItems,answers);
  const scores=cs.scores;
  const ranked=ORDER.slice().sort((a,b)=>scores[b]-scores[a]);
  const primary=ranked[0], secondary=ranked[1];
  const blend=(scores[primary]-scores[secondary])<=10;
  result={mode,primary,secondary,blend,scores,dims:cs.dims};
  saveLocal();
  setTimeout(()=>{screen="result";renderResult();},900);
}

// Tarjetas de perfil por dimension (solo modo completo).
function dimBreakdown(){
  const dims=result.dims||{};
  let cards="";
  DIMS.forEach(d=>{
    const dr=dims[d.k]; if(!dr)return;
    const lead=BIOS[dr.lead]; const pct=Math.round(dr.props[dr.lead]*100);
    const prelim=d.k==="mor"?`<div class="dim-prelim">${T("morPrelim")}</div>`:"";
    cards+=`<div class="dim-card" style="border-left:3px solid ${lead.hex}">
      <div class="dim-top"><span class="dim-name">${d[lang]}</span><span class="dim-sub">${lang==='es'?d.subEs:d.subEn}</span></div>
      <div class="dim-lead"><span class="dim-dot" style="background:${lead.hex}"></span><b style="color:${lead.hex}">${lead.name[lang]}</b><span class="dim-pct">${pct}%</span></div>
      ${prelim}
    </div>`;
  });
  return `<div class="dim-block">
    <h3 class="dim-h">${T("dimTitle")}</h3>
    <p class="dim-intro">${T("dimIntro")}</p>
    ${cards}
  </div>`;
}

/* ---- RESULT ---- */
function renderResult(){
  screen="result";
  const{primary,secondary,blend,scores}=result;
  const P=BIOS[primary], Sd=BIOS[secondary];
  const ranked=ORDER.slice().sort((a,b)=>scores[b]-scores[a]);
  let bars="";
  ranked.forEach(k=>{
    const b=BIOS[k];
    bars+=`<div class="bar-row">
      <div class="bar-top"><span style="color:${b.hex}">${b.name[lang]}</span><span class="pct">${scores[k]}%</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max(scores[k],2)}%;background:${b.hex}"></div></div>
    </div>`;
  });
  const conector=lang==="es"?`Tu ${P.name.es} se combina con tu ${Sd.name.es}, que ${Sd.secondary.es}.`:`Your ${P.name.en} combines with your ${Sd.name.en}, which ${Sd.secondary.en}.`;

  app.innerHTML=`
    <div class="hero-illo result-hero">
      <img class="illo-img" src="${imgUrl(P.img)}" alt="" loading="eager" decoding="async" onerror="this.remove()">
      <div class="illo-scrim" style="background:${scrim(P.hex)}"></div>
      <div class="illo-content">
        <div class="eyebrow">${T("resEyebrow")}</div>
        <h1>${P.name[lang]}</h1>
        <div class="poetic">${P.poetic[lang]}</div>
        <div class="second">${T("secondLabel")}: <b>${Sd.name[lang]}</b></div>
      </div>
    </div>
    ${blend?`<div class="blend-note">${T("blend")}</div>`:""}

    <div class="spectrum">
      <h3>${T("radarTitle")}</h3>
      ${radarSVG(scores)}
    </div>

    <div class="spectrum">
      <h3>${T("spectrumTitle")}</h3>
      ${bars}
    </div>

    ${result.mode==="complete"?dimBreakdown():""}

    <div class="section esencia" style="border-left-color:${P.hex}">
      <p style="font-size:17px;color:var(--ink);">${P.esencia[lang]}</p>
    </div>
    <div class="section">
      <h2><span class="dot" style="background:${P.hex}"></span>${T("secCog")}</h2>
      <p>${P.cog[lang]}</p>
    </div>
    <div class="section">
      <h2><span class="dot" style="background:${P.hex}"></span>${T("secBody")}</h2>
      <p>${P.body[lang]}</p>
    </div>
    <div class="section">
      <h2><span class="dot" style="background:${P.hex}"></span>${T("secShadow")}</h2>
      <p>${P.shadow[lang]}</p>
    </div>
    <div class="section">
      <h2><span class="dot" style="background:${P.hex}"></span>${T("secMaat")}</h2>
      <p>${P.maat[lang]}</p>
    </div>

    <div class="matiz" style="text-align:center;">
      <img class="illo-badge" src="${imgUrl(Sd.img)}" alt="" loading="lazy" decoding="async" onerror="this.remove()">
      <h2>${T("matizTitle")}</h2>
      <p>${conector}</p>
    </div>

    <div id="save-slot"></div>
    <div id="email-slot"></div>

    <div class="res-actions">
      <button class="btn-ghost" onclick="startQuiz()">${T("retake")}</button>
    </div>
    <p class="disclaimer">${T("disclaimer")}</p>`;

  renderSaveOrCta();
  renderEmailCard();
}

/* Guardar en perfil (si hay sesi\u00f3n) o CTA a MAAT (si no) */
function renderSaveOrCta(){
  const slot=document.getElementById("save-slot");
  if(sessionUser){
    slot.innerHTML=`<div class="cta-card">
      <h3>${T("openApp")}</h3>
      <div class="res-actions">
        <button id="save-btn" class="btn-primary" onclick="saveToProfile()">${T("saveProfile")}</button>
        <div id="save-msg"></div>
      </div>
    </div>`;
  }else{
    slot.innerHTML=`<div class="cta-card">
      <h3>${T("ctaTitle")}</h3>
      <p>${T("ctaBody")}</p>
      <a class="btn-primary" href="${CONFIG.LANDING_URL}">${T("ctaBtn")}</a>
    </div>`;
  }
}

async function saveToProfile(){
  const btn=document.getElementById("save-btn");
  const msg=document.getElementById("save-msg");
  if(!btn||!sessionUser)return;
  btn.disabled=true; const orig=btn.textContent; btn.textContent=T("saving");
  // dims -> mapa simple {dim:{s,c,m,f}} de proporciones (para el desglose en la app).
  const dimsFlat={};
  if(result.dims)for(const d in result.dims)dimsFlat[d]=result.dims[d].props;
  const{error}=await sb.from("profiles").update({
    biotype_primary:result.primary,
    biotype_secondary:result.secondary,
    biotype_scores:result.scores,
    biotype_dims:dimsFlat,
    biotype_taken_at:new Date().toISOString()
  }).eq("id",sessionUser.id);
  if(error){
    btn.disabled=false; btn.textContent=orig;
    msg.innerHTML=`<div class="err-msg">${error.message||"Error"}</div>`;
    return;
  }
  const slot=document.getElementById("save-slot");
  slot.innerHTML=`<div class="cta-card">
    <div class="res-actions">
      <span class="saved-badge">&#10003; ${T("saved")}</span>
      <a class="btn-ghost" href="${CONFIG.APP_URL}">${T("openApp")}</a>
    </div>
  </div>`;
}

/* Captura de email opcional (lead) */
function renderEmailCard(){
  if(sessionUser)return; // ya es cliente, no pedimos email
  const slot=document.getElementById("email-slot");
  slot.innerHTML=`<div class="cta-card">
    <h3>${T("emailTitle")}</h3>
    <p>${T("emailBody")}</p>
    <div class="field">
      <input id="lead-name" type="text" placeholder="${T("emailName")}" autocomplete="name">
      <input id="lead-email" type="email" placeholder="${T("emailPh")}" autocomplete="email" inputmode="email">
      <button class="btn-primary" onclick="submitLead()">${T("emailBtn")}</button>
      <div id="lead-msg"></div>
    </div>
  </div>`;
}
async function submitLead(){
  const nm=(document.getElementById("lead-name").value||"").trim();
  const em=(document.getElementById("lead-email").value||"").trim();
  const msg=document.getElementById("lead-msg");
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){ msg.innerHTML=`<div class="err-msg">${T("emailErr")}</div>`; return; }
  // 1) Captura garantizada del lead (aunque el correo falle).
  const{error}=await sb.from("biotype_leads").insert({
    email:em, name:nm||null,
    biotype_primary:result.primary, biotype_secondary:result.secondary,
    scores:result.scores, lang:lang
  });
  const slot=document.getElementById("email-slot");
  if(error){ msg.innerHTML=`<div class="err-msg">${error.message||"Error"}</div>`; return; }
  // 2) Envio del resultado por correo (best-effort; el contenido va ya localizado).
  sb.functions.invoke("send-biotipo-result",{body:{email:em,name:nm,render:buildEmailRender(nm)}})
    .then(({error:e})=>{ if(e)console.warn("email biotipo:",e.message||e); });
  slot.innerHTML=`<div class="cta-card"><div class="res-actions"><span class="saved-badge">&#10003; ${T("emailThanks")}</span></div></div>`;
}

/* Arma el contenido del correo (ES/EN) desde BIOS/UI: unica fuente de verdad. */
function buildEmailRender(nm){
  const P=BIOS[result.primary], Sd=BIOS[result.secondary];
  const ranked=ORDER.slice().sort((a,b)=>result.scores[b]-result.scores[a]);
  const conector=lang==="es"?`Tu ${P.name.es} se combina con tu ${Sd.name.es}, que ${Sd.secondary.es}.`:`Your ${P.name.en} combines with your ${Sd.name.en}, which ${Sd.secondary.en}.`;
  return {
    subject:`${T("emailSubject")}: ${P.name[lang]}`,
    greeting:nm?(lang==="es"?`Hola ${nm},`:`Hi ${nm},`):(lang==="es"?"Hola,":"Hi,"),
    intro:T("emailIntro"),
    primaryName:P.name[lang], secondaryName:Sd.name[lang], poetic:P.poetic[lang],
    primaryHex:P.hex, secondLabel:T("secondLabel"),
    logo:CONFIG.LOGO, heroImg:imgUrl(P.img), badgeImg:imgUrl(Sd.img),
    spectrumTitle:T("spectrumTitle"),
    spectrum:ranked.map(k=>({name:BIOS[k].name[lang],pct:result.scores[k],hex:BIOS[k].hex})),
    sections:[
      {title:T("secEssence"),text:P.esencia[lang]},
      {title:T("secCog"),text:P.cog[lang]},
      {title:T("secBody"),text:P.body[lang]},
      {title:T("secShadow"),text:P.shadow[lang]},
      {title:T("secMaat"),text:P.maat[lang]},
      {title:T("matizTitle"),text:conector}
    ],
    bridgeTitle:T("emailBridgeTitle"), bridgeText:T("emailBridgeText"),
    ctaLabel:T("ctaBtn"), ctaUrl:CONFIG.LANDING_URL,
    ps:T("emailPS"), footer:T("disclaimer")
  };
}

/* ---- Persistencia local ---- */
function saveLocal(){ try{localStorage.setItem("maat-biotipo",JSON.stringify(result));}catch(e){} }
function loadSaved(){ try{return JSON.parse(localStorage.getItem("maat-biotipo")||"null");}catch(e){return null;} }
function showSaved(){ const s=loadSaved(); if(s){result=s;screen="result";renderResult();} }

/* ---- Init ---- */
(async function init(){
  document.documentElement.lang=lang;
  document.getElementById("lang-es").classList.toggle("on",lang==="es");
  document.getElementById("lang-en").classList.toggle("on",lang==="en");
  try{
    const{data:{session}}=await sb.auth.getSession();
    if(session&&session.user)sessionUser=session.user;
  }catch(e){}
  renderIntro();
})();
</script>
</body>
</html>
