<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAAT &mdash; Dashboard de Feedback</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@400;600;700&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --c:#39A1C9; --o:#EBA055; --m:#7DCD93; --v:#896C8E; --r:#D76B6E;
  --bg:#0d1117; --bg2:#111827; --text:#e8eaf0; --mu:#8892a4; --mu2:#6b7280;
  --bd:rgba(255,255,255,0.08);
  --font-title:'Saira Condensed',sans-serif;
  --font-body:'Sora',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;padding:24px 16px 64px;}
.wrap{max-width:1080px;margin:0 auto;}
h1{font-family:var(--font-title);font-size:34px;font-weight:700;letter-spacing:.5px;}
h2{font-family:var(--font-title);font-size:20px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--mu);margin-bottom:16px;}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;flex-wrap:wrap;gap:12px;}
.head .sub{color:var(--mu);font-size:13px;}
.head-right{display:flex;align-items:center;gap:10px;}
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:16px;padding:24px;margin-bottom:20px;}
.hidden{display:none!important;}

/* Language toggle */
.lang-toggle{display:inline-flex;gap:2px;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:3px;}
.lang-toggle button{border:none;background:transparent;font-family:var(--font-title);font-size:12px;font-weight:700;letter-spacing:1px;color:var(--mu);padding:5px 11px;border-radius:16px;cursor:pointer;}
.lang-toggle button.on{background:var(--v);color:#fff;}
.auth-top{display:flex;justify-content:flex-end;margin-bottom:14px;}

/* Auth */
.auth{max-width:400px;margin:60px auto;}
.field{margin-bottom:14px;}
.field label{display:block;font-family:var(--font-title);font-size:12px;letter-spacing:1.5px;color:var(--mu);text-transform:uppercase;margin-bottom:6px;}
.field input{width:100%;padding:12px 14px;background:var(--bg);border:1.5px solid var(--bd);border-radius:10px;font-family:var(--font-body);font-size:15px;color:var(--text);outline:none;}
.field input:focus{border-color:var(--c);}
.btn{width:100%;padding:14px;background:var(--v);color:#fff;border:none;border-radius:10px;font-family:var(--font-title);font-size:15px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;}
.btn:hover{background:var(--c);}
.btn:disabled{opacity:.6;cursor:not-allowed;}
.btn-ghost{background:none;border:1px solid var(--bd);color:var(--mu);padding:8px 14px;border-radius:8px;font-family:var(--font-title);font-size:12px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;}
.btn-ghost:hover{border-color:var(--c);color:var(--text);}
.err-box{background:rgba(215,107,110,.12);color:var(--r);padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px;display:none;}
.err-box.show{display:block;}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px;}
.kpi{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:18px;position:relative;overflow:hidden;}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--c);}
.kpi[data-t="nps"]::before{background:var(--m);}
.kpi[data-t="sat"]::before{background:var(--o);}
.kpi[data-t="ref"]::before{background:var(--v);}
.kpi[data-t="tw"]::before{background:var(--r);}
.kpi .label{font-family:var(--font-title);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mu);margin-bottom:6px;}
.kpi .val{font-family:var(--font-title);font-size:36px;font-weight:700;line-height:1;}
.kpi .foot{font-size:11.5px;color:var(--mu2);margin-top:6px;}

/* NPS bar */
.npsbar{display:flex;height:26px;border-radius:8px;overflow:hidden;margin:10px 0 8px;background:var(--bg);}
.npsbar div{display:flex;align-items:center;justify-content:center;font-size:11px;font-family:var(--font-title);font-weight:700;color:#0d1117;}
.npslegend{display:flex;gap:16px;font-size:11.5px;color:var(--mu);flex-wrap:wrap;}
.npslegend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;}

/* Tabla */
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{font-family:var(--font-title);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mu);text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd);}
td{padding:9px 10px;border-bottom:1px solid var(--bd);}
tr:last-child td{border-bottom:none;}
.delta-up{color:var(--m);font-weight:600;}
.delta-dn{color:var(--r);font-weight:600;}
.delta-0{color:var(--mu2);}
.muted{color:var(--mu);}
.quote{border-left:3px solid var(--v);padding:8px 14px;margin:8px 0;color:var(--text);font-size:13.5px;background:rgba(137,108,142,.08);border-radius:0 8px 8px 0;}
.quote .who{display:block;font-size:11px;color:var(--mu);margin-top:4px;font-family:var(--font-title);letter-spacing:1px;text-transform:uppercase;}
select{background:var(--bg);color:var(--text);border:1.5px solid var(--bd);border-radius:8px;padding:9px 12px;font-family:var(--font-body);font-size:14px;outline:none;min-width:220px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.empty{color:var(--mu2);font-size:13.5px;text-align:center;padding:24px 0;}
.tag{display:inline-block;font-size:10.5px;font-family:var(--font-title);letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border-radius:20px;border:1px solid var(--bd);color:var(--mu);}
.tag.ok{color:var(--m);border-color:rgba(125,205,147,.4);}
@media (max-width:860px){.grid2{grid-template-columns:1fr;}}
/* ---------- Testimonios en la web (moderacion) ---------- */
.tw-filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.tw-filter button{background:var(--bg);border:1px solid var(--bd);color:var(--mu);padding:7px 13px;border-radius:20px;font-family:var(--font-title);font-size:12px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;}
.tw-filter button.on{background:var(--v);border-color:var(--v);color:#fff;}
.tw-filter button .n{opacity:.8;margin-left:4px;}
.tw-item{border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px;background:var(--bg);}
.tw-head{display:flex;gap:14px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
.tw-ph{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none;background:var(--bg2);border:1px solid var(--bd);}
.tw-ini{width:56px;height:56px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:var(--bg2);border:1px solid var(--bd);font-family:var(--font-title);font-size:18px;color:var(--mu);}
.tw-who{flex:1;min-width:180px;}
.tw-who strong{display:block;font-size:15px;}
.tw-who span{font-size:12.5px;color:var(--mu);}
.tw-chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px;}
.tag.warn{color:var(--o);border-color:rgba(235,160,85,.5);}
.tag.bad{color:var(--r);border-color:rgba(215,107,110,.5);}
.tw-quote{white-space:pre-wrap;font-size:14px;color:var(--text);margin:8px 0 12px;padding:10px 14px;border-left:3px solid var(--v);background:rgba(137,108,142,.08);border-radius:0 8px 8px 0;}
.tw-meta{font-size:12px;color:var(--mu2);margin-bottom:12px;word-break:break-word;}
.tw-alert{background:rgba(235,160,85,.1);border:1px solid rgba(235,160,85,.4);color:var(--o);padding:9px 12px;border-radius:8px;font-size:12.5px;margin-bottom:10px;}
.tw-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.tw-actions label{font-size:12.5px;color:var(--mu);display:flex;gap:6px;align-items:center;}
.tw-actions select{min-width:0;padding:7px 10px;font-size:13px;}
.tw-actions .btn-ghost.go{background:var(--v);border-color:var(--v);color:#fff;}
.tw-actions .btn-ghost.danger:hover{border-color:var(--r);color:var(--r);}
.tw-note{width:100%;margin-top:10px;padding:8px 10px;background:var(--bg2);border:1px solid var(--bd);border-radius:8px;color:var(--text);font-family:var(--font-body);font-size:12.5px;}
.tw-msg{padding:11px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;}
.tw-msg.err{background:rgba(215,107,110,.12);border:1px solid rgba(215,107,110,.45);color:var(--r);}
.tw-msg.ok{background:rgba(125,205,147,.1);border:1px solid rgba(125,205,147,.4);color:var(--m);}
.tw-ask{display:flex;gap:10px;align-items:center;flex-wrap:wrap;width:100%;padding:10px 12px;border-radius:10px;background:rgba(235,160,85,.1);border:1px solid rgba(235,160,85,.4);font-size:13px;}
.tw-ask span{flex:1;min-width:200px;color:var(--text);}
.tw-ask .btn-ghost.danger{background:var(--r);border-color:var(--r);color:#fff;}
.tw-setup{background:rgba(215,107,110,.1);border:1px solid rgba(215,107,110,.4);color:var(--r);padding:12px 14px;border-radius:10px;font-size:13px;}

</style>
</head>
<body>
<div class="wrap">

  <!-- AUTH -->
  <div class="card auth" id="auth-card">
    <div class="auth-top"><div class="lang-toggle"></div></div>
    <h1 style="margin-bottom:6px;" id="s-auth-h1"></h1>
    <p class="sub" style="color:var(--mu);margin-bottom:20px;" id="s-auth-sub"></p>
    <div class="err-box" id="auth-err"></div>
    <div class="field"><label for="a-email" id="lbl-email"></label><input type="email" id="a-email" autocomplete="email"></div>
    <div class="field"><label for="a-pass" id="lbl-pass"></label><input type="password" id="a-pass" autocomplete="current-password"></div>
    <button class="btn" id="a-btn" onclick="doLogin()"></button>
  </div>

  <!-- DASH -->
  <div id="dash" class="hidden">
    <div class="head">
      <div>
        <h1 id="s-head-h1"></h1>
        <div class="sub" id="head-sub"></div>
      </div>
      <div class="head-right">
        <div class="lang-toggle"></div>
        <button class="btn-ghost" id="btn-logout" onclick="doLogout()"></button>
      </div>
    </div>

    <div class="kpis" id="kpis"></div>

    <div class="card">
      <h2 id="s-h2-curve"></h2>
      <div id="curve"></div>
    </div>

    <div class="grid2">
      <div class="card">
        <h2 id="s-h2-radar"></h2>
        <div id="radar"></div>
      </div>
      <div class="card">
        <h2 id="s-h2-nps"></h2>
        <div id="nps"></div>
      </div>
    </div>

    <div class="card">
      <h2 id="s-h2-ficha"></h2>
      <select id="client-sel" onchange="renderFicha()"></select>
      <div id="ficha" style="margin-top:18px;"></div>
    </div>

    <div class="card" id="tw-card">
      <h2 id="s-h2-tweb"></h2>
      <p class="muted" id="tw-sub" style="font-size:13px;margin:-6px 0 14px;"></p>
      <div class="tw-filter" id="tw-bar"></div>
      <div id="tw-msg" class="tw-msg hidden" role="status" aria-live="polite"></div>
      <div id="tw-list"></div>
    </div>

    <div class="grid2">
      <div class="card">
        <h2 id="s-h2-testi"></h2>
        <div id="testimonios"></div>
      </div>
      <div class="card">
        <h2 id="s-h2-refs"></h2>
        <div id="referidos"></div>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const CONFIG={
  SUPABASE_URL:"https://pcclptmojjzqmfmzftot.supabase.co",
  SUPABASE_ANON_KEY:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBjY2xwdG1vamp6cW1mbXpmdG90Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4OTg3MjAsImV4cCI6MjA4NzQ3NDcyMH0.VuFBEy19fgNN5pSp_r8p2ZVViniunKdVW7Hy3AmqJXE"
};
const sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});

/* ---------- i18n (comparte la clave maat-lang con la app MAAT) ---------- */
let lang=localStorage.getItem("maat-lang")||"es";
function L(es,en){return lang==="es"?es:en;}
function setLang(l){
  lang=l;localStorage.setItem("maat-lang",l);
  renderLangToggle();applyStaticI18N();
  if(!document.getElementById("dash").classList.contains("hidden"))renderAll();
}
function renderLangToggle(){
  const html=`<button class="${lang==="es"?"on":""}" onclick="setLang('es')">ES</button>`+
             `<button class="${lang==="en"?"on":""}" onclick="setLang('en')">EN</button>`;
  document.querySelectorAll(".lang-toggle").forEach(el=>{el.innerHTML=html;});
}
function setTxt(id,txt){const e=document.getElementById(id);if(e)e.textContent=txt;}
function applyStaticI18N(){
  document.documentElement.lang=lang;
  setTxt("s-auth-h1",L("Dashboard de Feedback","Feedback Dashboard"));
  setTxt("s-auth-sub",L("Solo mentores y administradores.","Mentors and admins only."));
  setTxt("lbl-email",L("Correo","Email"));
  setTxt("lbl-pass",L("Contrase\u00F1a","Password"));
  setTxt("a-btn",L("Entrar","Sign in"));
  setTxt("s-head-h1",L("Feedback & Cierre","Feedback & Closing"));
  setTxt("btn-logout",L("Salir","Sign out"));
  setTxt("s-h2-curve",L("Curva de transformaci\u00F3n","Transformation curve"));
  setTxt("s-h2-radar",L("Entorno: antes vs despu\u00E9s","Environment: before vs after"));
  setTxt("s-h2-nps",L("Recomendaci\u00F3n (NPS)","Recommendation (NPS)"));
  setTxt("s-h2-ficha",L("Ficha individual","Individual profile"));
  setTxt("s-h2-testi",L("Testimonios autorizados","Authorized testimonials"));
  setTxt("s-h2-tweb",L("Testimonios en la web","Website testimonials"));
  setTxt("tw-sub",L("Los env\u00EDan los clientes desde somosmaat.org/es/testimonios. Nada se publica hasta que lo apruebas aqu\u00ED; el correo nunca se muestra en el sitio.","Clients send them from somosmaat.org/en/testimonials. Nothing is published until you approve it here; the email is never shown on the site."));
  setTxt("s-h2-refs",L("Leads referidos","Referred leads"));
  if(D.me)setHeadSub(D.me);
}

const DIMS=[
  {k:"actitud",   es:"Actitud",    en:"Attitude",   col:"var(--c)"},
  {k:"claridad",  es:"Claridad",   en:"Clarity",    col:"var(--o)"},
  {k:"confianza", es:"Confianza",  en:"Confidence", col:"var(--m)"},
  {k:"energia",   es:"Energ\u00EDa",    en:"Energy",     col:"var(--v)"}
];
const ENT=[
  {k:"ent_profesional",   es:"Profesional",   en:"Professional"},
  {k:"ent_relaciones",    es:"Relaciones",    en:"Relationships"},
  {k:"ent_familiar",      es:"Familiar",      en:"Family"},
  {k:"ent_intrapersonal", es:"Intrapersonal", en:"Intrapersonal"}
];
const MOMS=["inicio","intermedio","final"];
const MOM_LABEL={inicio:{es:"Inicio",en:"Start"},intermedio:{es:"Intermedio",en:"Midpoint"},final:{es:"Cierre",en:"Closing"}};
function dimT(d){return d[lang];}
function momL(m){return MOM_LABEL[m][lang];}

const D={rows:[],refs:[],profiles:{},overview:null,me:null,tw:[],twErr:false,twFilter:"pending",twAsk:null};

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function show(id){document.getElementById(id).classList.remove("hidden");}
function hide(id){document.getElementById(id).classList.add("hidden");}
function showErr(id,m){const e=document.getElementById(id);e.textContent=m;e.classList.add("show");}
function avg(arr){const v=arr.filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;}
function f1(n){return n==null?"--":(Math.round(n*10)/10).toFixed(1);}

/* ---------- Auth ---------- */
async function doLogin(){
  document.getElementById("auth-err").classList.remove("show");
  const email=document.getElementById("a-email").value.trim().toLowerCase();
  const pass=document.getElementById("a-pass").value;
  const btn=document.getElementById("a-btn");btn.disabled=true;btn.textContent=L("Entrando...","Signing in...");
  const{error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){showErr("auth-err",L("Credenciales incorrectas.","Incorrect credentials."));btn.disabled=false;btn.textContent=L("Entrar","Sign in");return;}
  await boot();
}
async function doLogout(){try{await sb.auth.signOut();}catch(_){}location.reload();}

function setHeadSub(me){
  document.getElementById("head-sub").textContent=
    L("Sesi\u00F3n de ","Session of ")+(me.full_name||"")+" \u00B7 "+L("rol ","role ")+me.role;
}

async function boot(){
  const{data:{user}}=await sb.auth.getUser();
  if(!user){hide("dash");show("auth-card");return;}
  const{data:me}=await sb.from("profiles").select("role,full_name,preferred_lang").eq("id",user.id).maybeSingle();
  if(!me||!["mentor","admin"].includes(me.role)){
    showErr("auth-err",L("Tu cuenta no tiene acceso a este panel.","Your account has no access to this panel."));
    await sb.auth.signOut();hide("dash");show("auth-card");return;
  }
  D.me=me;
  if(me.preferred_lang&&me.preferred_lang!==lang){
    lang=me.preferred_lang;localStorage.setItem("maat-lang",lang);
    renderLangToggle();applyStaticI18N();
  }
  hide("auth-card");show("dash");
  setHeadSub(me);
  await loadData();
}

/* Regla 6: Promise.allSettled, nunca Promise.all */
async function loadData(){
  const res=await Promise.allSettled([
    sb.from("client_feedback").select("*"),
    sb.from("client_referrals").select("*").order("created_at",{ascending:false}),
    sb.from("profiles").select("id,full_name,current_week,preferred_lang").eq("role","client"),
    sb.rpc("get_feedback_overview"),
    sb.from("testimonials").select("id,created_at,status,lang,name,email,role,location,quote,photo_path,niche,featured,matched_user_id,admin_note,published_at").order("created_at",{ascending:false})
  ]);
  D.rows=(res[0].status==="fulfilled"&&res[0].value.data)||[];
  D.refs=(res[1].status==="fulfilled"&&res[1].value.data)||[];
  const profs=(res[2].status==="fulfilled"&&res[2].value.data)||[];
  D.profiles={};profs.forEach(p=>{D.profiles[p.id]=p;});
  D.overview=(res[3].status==="fulfilled"&&res[3].value.data)||null;
  D.twErr=!(res[4].status==="fulfilled"&&!res[4].value.error);
  D.tw=(!D.twErr&&res[4].value.data)||[];
  renderAll();
}

function renderAll(){
  renderKPIs(Object.keys(D.profiles).length);
  renderCurve();
  renderRadar();
  renderNPS();
  renderClientSel();
  renderFicha();
  renderTW();
  renderTestimonios();
  renderReferidos();
}

/* ---------- KPIs ---------- */
function npsCalc(){
  const v=D.rows.map(r=>r.nps).filter(x=>x!=null);
  if(!v.length)return{n:0,score:null,p:0,pa:0,d:0};
  const p=v.filter(x=>x>=9).length,d=v.filter(x=>x<=6).length,pa=v.length-p-d;
  return{n:v.length,score:Math.round((p-d)/v.length*100),p,pa,d};
}
function renderKPIs(totalClients){
  const n=npsCalc();
  const sat=avg(D.rows.filter(r=>r.moment==="final").map(r=>r.satisfaccion));
  const finales=D.rows.filter(r=>r.moment==="final").length;
  const inicios=D.rows.filter(r=>r.moment==="inicio").length;
  const pend=D.refs.filter(r=>!r.synced_to_crm).length;
  document.getElementById("kpis").innerHTML=`
    <div class="kpi" data-t="nps"><div class="label">NPS</div><div class="val">${n.score==null?"--":(n.score>0?"+":"")+n.score}</div><div class="foot">${n.n} ${L("respuesta(s) de cierre","closing response(s)")}</div></div>
    <div class="kpi" data-t="sat"><div class="label">${L("Satisfacci\u00F3n final","Final satisfaction")}</div><div class="val">${f1(sat)}</div><div class="foot">${L("promedio sobre 10","average out of 10")}</div></div>
    <div class="kpi"><div class="label">${L("Cierres completados","Completed closings")}</div><div class="val">${finales}</div><div class="foot">${inicios} ${L("l\u00EDnea(s) base registrada(s)","baseline(s) recorded")}</div></div>
    <div class="kpi" data-t="tw"><div class="label">${L("Testimonios publicados","Published testimonials")}</div><div class="val">${D.tw.filter(t=>t.status==="approved").length}</div><div class="foot">${D.tw.filter(t=>t.status==="pending").length} ${L("por revisar","to review")}</div></div>
    <div class="kpi" data-t="ref"><div class="label">${L("Leads referidos","Referred leads")}</div><div class="val">${D.refs.length}</div><div class="foot">${pend} ${L("sin pasar al CRM","not yet in CRM")}</div></div>`;
}

/* ---------- Curva de transformacion ---------- */
function renderCurve(){
  const has=MOMS.some(m=>D.rows.some(r=>r.moment===m));
  if(!has){document.getElementById("curve").innerHTML=`<div class="empty">${L("A\u00FAn no hay respuestas.","No answers yet.")}</div>`;return;}
  const W=880,H=280,PL=44,PR=16,PT=18,PB=38;
  const x=i=>PL+i*((W-PL-PR)/(MOMS.length-1));
  const y=v=>PT+(10-v)/9*(H-PT-PB);
  let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;">`;
  [1,4,7,10].forEach(g=>{
    svg+=`<line x1="${PL}" y1="${y(g)}" x2="${W-PR}" y2="${y(g)}" stroke="rgba(255,255,255,.07)"/>
          <text x="${PL-10}" y="${y(g)+4}" fill="#6b7280" font-size="11" text-anchor="end">${g}</text>`;
  });
  MOMS.forEach((m,i)=>{
    const n=D.rows.filter(r=>r.moment===m).length;
    const anchor=i===0?"start":(i===MOMS.length-1?"end":"middle");
    svg+=`<text x="${x(i)}" y="${H-14}" fill="#8892a4" font-size="12" text-anchor="${anchor}" font-family="Saira Condensed">${momL(m).toUpperCase()} (${n})</text>`;
  });
  DIMS.forEach(d=>{
    const pts=MOMS.map((m,i)=>{
      const a=avg(D.rows.filter(r=>r.moment===m).map(r=>r[d.k]));
      return a==null?null:{x:x(i),y:y(a),v:a};
    });
    const valid=pts.filter(p=>p);
    if(valid.length<1)return;
    let path="";
    pts.forEach((p,i)=>{if(p)path+=(path?" L":"M")+p.x+" "+p.y;});
    svg+=`<path d="${path}" fill="none" stroke="${d.col}" stroke-width="2.5" stroke-linecap="round"/>`;
    valid.forEach(p=>{svg+=`<circle cx="${p.x}" cy="${p.y}" r="4.5" fill="${d.col}"/>`;});
  });
  svg+=`</svg>`;
  const legend=DIMS.map(d=>{
    const ini=avg(D.rows.filter(r=>r.moment==="inicio").map(r=>r[d.k]));
    const fin=avg(D.rows.filter(r=>r.moment==="final").map(r=>r[d.k]));
    const dl=(ini!=null&&fin!=null)?(fin-ini):null;
    const cls=dl==null?"delta-0":(dl>0.05?"delta-up":(dl<-0.05?"delta-dn":"delta-0"));
    const txt=dl==null?"--":(dl>0?"+":"")+f1(dl);
    return `<span style="margin-right:18px;font-size:12.5px;"><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${d.col};margin-right:6px;"></i>${dimT(d)} <b class="${cls}">${txt}</b></span>`;
  }).join("");
  document.getElementById("curve").innerHTML=svg+`<div style="margin-top:10px;">${legend}</div>
    <div class="muted" style="font-size:12px;margin-top:6px;">${L("Delta = promedio de cierre menos promedio de inicio.","Delta = closing average minus start average.")}</div>`;
}

/* ---------- Radar entorno ---------- */
function renderRadar(){
  const ini=ENT.map(e=>avg(D.rows.filter(r=>r.moment==="inicio").map(r=>r[e.k])));
  const fin=ENT.map(e=>avg(D.rows.filter(r=>r.moment==="final").map(r=>r[e.k])));
  if(ini.every(v=>v==null)&&fin.every(v=>v==null)){
    document.getElementById("radar").innerHTML=`<div class="empty">${L("A\u00FAn no hay datos de entorno.","No environment data yet.")}</div>`;return;
  }
  const W=400,H=300,cx=W/2,cy=H/2+6,R=100;
  const ang=i=>(Math.PI*2*i/ENT.length)-Math.PI/2;
  const pt=(i,v)=>[cx+Math.cos(ang(i))*(R*(v/10)),cy+Math.sin(ang(i))*(R*(v/10))];
  let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:380px;height:auto;display:block;margin:0 auto;">`;
  [2.5,5,7.5,10].forEach(g=>{
    const p=ENT.map((_,i)=>pt(i,g).join(",")).join(" ");
    svg+=`<polygon points="${p}" fill="none" stroke="rgba(255,255,255,.08)"/>`;
  });
  ENT.forEach((e,i)=>{
    const[ex,ey]=pt(i,10);
    svg+=`<line x1="${cx}" y1="${cy}" x2="${ex}" y2="${ey}" stroke="rgba(255,255,255,.08)"/>`;
    const[lx,ly]=pt(i,12.4);
    svg+=`<text x="${lx}" y="${ly}" fill="#8892a4" font-size="10.5" text-anchor="middle" font-family="Saira Condensed">${dimT(e).toUpperCase()}</text>`;
  });
  function poly(vals,col,fill){
    if(vals.some(v=>v==null))return"";
    const p=vals.map((v,i)=>pt(i,v).join(",")).join(" ");
    return `<polygon points="${p}" fill="${fill}" stroke="${col}" stroke-width="2"/>`;
  }
  svg+=poly(ini,"#8892a4","rgba(136,146,164,.12)");
  svg+=poly(fin,"#7DCD93","rgba(125,205,147,.18)");
  svg+=`</svg>`;
  const rows=ENT.map((e,i)=>{
    const a=ini[i],b=fin[i],dl=(a!=null&&b!=null)?b-a:null;
    const cls=dl==null?"delta-0":(dl>0.05?"delta-up":(dl<-0.05?"delta-dn":"delta-0"));
    return `<tr><td>${dimT(e)}</td><td class="muted">${f1(a)}</td><td>${f1(b)}</td><td class="${cls}">${dl==null?"--":(dl>0?"+":"")+f1(dl)}</td></tr>`;
  }).join("");
  document.getElementById("radar").innerHTML=svg+
    `<div style="margin:10px 0;font-size:12px;color:var(--mu);text-align:center;">
      <i style="display:inline-block;width:9px;height:9px;background:#8892a4;border-radius:2px;margin-right:5px;"></i>${momL("inicio")}
      <i style="display:inline-block;width:9px;height:9px;background:#7DCD93;border-radius:2px;margin:0 5px 0 14px;"></i>${momL("final")}
     </div>
     <table><tr><th>${L("Eje","Axis")}</th><th>${momL("inicio")}</th><th>${momL("final")}</th><th>${L("Delta","Delta")}</th></tr>${rows}</table>`;
}

/* ---------- Testimonios en la web: revision + satisfaccion del cliente ---------- */
const TW_ST={pending:{es:"Por revisar",en:"To review"},approved:{es:"Publicado",en:"Published"},rejected:{es:"No publicado",en:"Not published"},withdrawn:{es:"Retirado",en:"Withdrawn"}};
const TW_ORDER=["pending","approved","rejected","withdrawn"];
const TW_NICHE=[["pros",{es:"L\u00EDderes y ejecutivos",en:"Leaders & executives"}],["artists",{es:"Artistas y deportistas",en:"Artists & athletes"}],["founders",{es:"Empresarios y fundadores",en:"Founders & business owners"}],["orgs",{es:"Organizaciones",en:"Organizations"}]];
function twPhoto(t){return t.photo_path?CONFIG.SUPABASE_URL+"/storage/v1/object/public/testimonial-photos/"+encodeURIComponent(t.photo_path):null;}
function twInit(n){const w=String(n||"").trim().split(/\s+/);return ((w[0]||"").charAt(0)+(w.length>1?w[w.length-1].charAt(0):"")).toUpperCase();}
/* Satisfaccion y NPS del cliente cuyo correo coincide (modulo de feedback): el cierre manda; si no hay, el intermedio. */
function twFeedback(t){
  if(!t.matched_user_id)return null;
  const mine=D.rows.filter(r=>r.user_id===t.matched_user_id);
  const fin=mine.find(r=>r.moment==="final");
  const mid=mine.find(r=>r.moment==="intermedio");
  const sat=fin&&fin.satisfaccion!=null?fin.satisfaccion:(mid?mid.satisfaccion:null);
  const nps=fin&&fin.nps!=null?fin.nps:null;
  const p=D.profiles[t.matched_user_id];
  return{name:p&&p.full_name?p.full_name:null,sat:sat,satFrom:fin&&fin.satisfaccion!=null?"final":(mid?"intermedio":null),nps:nps,closed:!!fin,
         low:(sat!=null&&sat<=6)||(nps!=null&&nps<=6)};
}
function twChips(t,fb){
  const c=[`<span class="tag ${t.status==="approved"?"ok":t.status==="pending"?"warn":""}">${esc(TW_ST[t.status][lang])}</span>`,`<span class="tag">${esc(String(t.lang||"es").toUpperCase())}</span>`];
  if(fb){
    c.push(`<span class="tag ok">${L("Cliente verificado","Verified client")}</span>`);
    c.push(fb.sat!=null?`<span class="tag ${fb.sat<=6?"bad":"ok"}">${L("Satisfacci\u00F3n","Satisfaction")} ${fb.sat}/10 (${fb.satFrom==="final"?L("cierre","closing"):L("intermedio","midpoint")})</span>`
                         :`<span class="tag">${L("Sin satisfacci\u00F3n a\u00FAn","No satisfaction yet")}</span>`);
    c.push(fb.nps!=null?`<span class="tag ${fb.nps<=6?"bad":fb.nps>=9?"ok":""}">NPS ${fb.nps}</span>`:`<span class="tag">${fb.closed?L("Cierre sin NPS","Closing without NPS"):L("Sin cierre a\u00FAn","Closing not done yet")}</span>`);
  }else c.push(`<span class="tag warn">${L("Sin cuenta: verif\u00EDcalo t\u00FA","No account: verify it yourself")}</span>`);
  if(t.featured)c.push(`<span class="tag ok">${L("Destacado","Featured")}</span>`);
  return c.join("");
}
function twActions(t){
  if(D.twAsk&&D.twAsk.id===t.id){
    const del=D.twAsk.act==="delete";
    const q=del?L("\u00BFEliminar este testimonio y su foto? No se puede deshacer.","Delete this testimonial and its photo? This cannot be undone.")
               :L("Su satisfacci\u00F3n o su NPS son bajos. \u00BFPublicar de todos modos?","Their satisfaction or NPS is low. Publish anyway?");
    return `<div class="tw-ask"><span>${q}</span>
      <button class="btn-ghost ${del?"danger":"go"}" data-act="${del?"delete":"approve-force"}" data-id="${esc(t.id)}">${del?L("S\u00ED, eliminar","Yes, delete"):L("S\u00ED, publicar","Yes, publish")}</button>
      <button class="btn-ghost" data-act="cancel" data-id="${esc(t.id)}">${L("Cancelar","Cancel")}</button></div>`;
  }
  const nopts=`<option value="">${L("Sin categor\u00EDa","No category")}</option>`+TW_NICHE.map(n=>`<option value="${n[0]}"${t.niche===n[0]?" selected":""}>${esc(n[1][lang])}</option>`).join("");
  const sel=`<label>${L("Categor\u00EDa","Category")} <select data-niche>${nopts}</select></label>`;
  const feat=`<label><input type="checkbox" data-feat${t.featured?" checked":""}> ${L("Destacar en la portada","Feature on home")}</label>`;
  const del=`<button class="btn-ghost danger" data-act="ask-delete" data-id="${esc(t.id)}">${L("Eliminar","Delete")}</button>`;
  if(t.status==="pending")return sel+feat+`<button class="btn-ghost go" data-act="approve" data-id="${esc(t.id)}">${L("Aprobar y publicar","Approve & publish")}</button><button class="btn-ghost" data-act="reject" data-id="${esc(t.id)}">${L("No publicar","Don't publish")}</button>`+del;
  if(t.status==="approved")return sel+feat+`<button class="btn-ghost" data-act="save" data-id="${esc(t.id)}">${L("Guardar","Save")}</button><button class="btn-ghost" data-act="unpublish" data-id="${esc(t.id)}">${L("Despublicar","Unpublish")}</button>`+del;
  if(t.status==="rejected")return `<button class="btn-ghost" data-act="reopen" data-id="${esc(t.id)}">${L("Volver a por revisar","Back to review")}</button>`+del;
  return del;
}

      <input class="tw-note" data-note placeholder="${L("Nota interna (no se publica)","Internal note (never published)")}" value="${esc(t.admin_note||"")}" maxlength="500">

/* Mensajes dentro de la pagina: alert()/confirm() del navegador fallan en navegadores integrados y no avisaban de nada. */
function twMsg(text,kind){
  const m=document.getElementById("tw-msg");
  if(!text){m.classList.add("hidden");m.textContent="";return;}
  m.textContent=text;m.className="tw-msg "+(kind||"err");
}
/* .select("id") hace que la base devuelva las filas afectadas: si vienen 0, el RLS lo rechazo en silencio y lo mostramos. */
async function twUpdate(id,patch){
  const{data,error}=await sb.from("testimonials").update(patch).eq("id",id).select("id");
  if(error){twMsg(L("No pudimos guardar: ","Could not save: ")+error.message,"err");return false;}
  if(!data||!data.length){twMsg(L("No se guard\u00F3 el cambio: la base de datos no lo permiti\u00F3 (permisos). Recarga la p\u00E1gina e int\u00E9ntalo de nuevo.","The change was not saved: the database did not allow it (permissions). Reload the page and try again."),"err");return false;}
  const t=D.tw.find(x=>x.id===id);if(t)Object.assign(t,patch);
  return true;
}
async function twDelete(t){
  if(t.photo_path){
    const r=await sb.storage.from("testimonial-photos").remove([t.photo_path]);
    if(r.error){twMsg(L("No pudimos borrar la foto: ","Could not delete the photo: ")+r.error.message,"err");return false;}
  }
  const{data,error}=await sb.from("testimonials").delete().eq("id",t.id).select("id");
  if(error){twMsg(L("No pudimos eliminarlo: ","Could not delete it: ")+error.message,"err");return false;}
  if(!data||!data.length){twMsg(L("No se elimin\u00F3: la base de datos no lo permiti\u00F3 (permisos). Recarga la p\u00E1gina e int\u00E9ntalo de nuevo.","Not deleted: the database did not allow it (permissions). Reload the page and try again."),"err");return false;}
  D.tw=D.tw.filter(x=>x.id!==t.id);
  twMsg(L("Testimonio eliminado.","Testimonial deleted."),"ok");
  return true;
}
async function twAct(act,id,btn){
  const t=D.tw.find(x=>x.id===id);if(!t)return;
  if(act==="cancel"){D.twAsk=null;renderTW();return;}
  twMsg(null);
  if(act==="ask-delete"){D.twAsk={id:id,act:"delete"};renderTW();return;}
  const card=btn.closest(".tw-item");
  let v={niche:(card.querySelector("[data-niche]")||{}).value||null,feat:!!(card.querySelector("[data-feat]")||{}).checked,note:(card.querySelector("[data-note]")||{}).value||null};
  if(act==="approve"){
    const fb=twFeedback(t);
    if(fb&&fb.low){D.twAsk={id:id,act:"approve",vals:v};renderTW();return;}
  }
  if(act==="approve-force"&&D.twAsk&&D.twAsk.id===id&&D.twAsk.vals)v=D.twAsk.vals;
  btn.disabled=true;
  try{
    if(act==="approve"||act==="approve-force")await twUpdate(id,{status:"approved",niche:v.niche,featured:v.feat,admin_note:v.note});
    else if(act==="save")await twUpdate(id,{niche:v.niche,featured:v.feat,admin_note:v.note});
    else if(act==="reject")await twUpdate(id,{status:"rejected",admin_note:v.note});
    else if(act==="unpublish"||act==="reopen")await twUpdate(id,{status:"pending",admin_note:v.note});
    else if(act==="delete")await twDelete(t);
  }finally{btn.disabled=false;}
  D.twAsk=null;
  renderKPIs(Object.keys(D.profiles).length);renderTW();renderTestimonios();
}
document.getElementById("tw-list").addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(b)twAct(b.dataset.act,b.dataset.id,b);});
document.getElementById("tw-list").addEventListener("change",e=>{
  if(!e.target.matches("[data-note]"))return;
  const id=e.target.closest(".tw-item").dataset.id;twUpdate(id,{admin_note:e.target.value.trim()||null});
});
document.getElementById("tw-bar").addEventListener("click",e=>{const b=e.target.closest("[data-f]");if(b){D.twFilter=b.dataset.f;renderTW();}});

/* Invitacion: mensaje listo para pegar en WhatsApp para quien autorizo su frase de cierre */
function twInviteMsg(userId){
  const p=D.profiles[userId]||{};
  const first=String(p.full_name||"").trim().split(/\s+/)[0]||"";
  const en=p.preferred_lang==="en";
  const url="https://somosmaat.org/"+(en?"en/testimonials/":"es/testimonios/")+(en?"#share":"#comparte");
  return en
    ?"Hi "+first+", thank you for closing your MAAT process. Would you share your experience with a photo, your profession and where you are from? It takes 5 minutes and you can edit or withdraw it any time: "+url
    :"Hola "+first+", gracias por cerrar tu proceso MAAT. \u00BFTe animas a contar tu experiencia con tu foto, tu profesi\u00F3n y desde d\u00F3nde nos escribes? Toma 5 minutos y puedes editarlo o retirarlo cuando quieras: "+url;
}
async function twCopyInvite(userId,btn){
  const msg=twInviteMsg(userId),old=btn.textContent;
  try{await navigator.clipboard.writeText(msg);btn.textContent=L("\u00A1Copiado!","Copied!");}
  catch(_){window.prompt(L("Copia el mensaje:","Copy the message:"),msg);}
  setTimeout(()=>{btn.textContent=old;},2000);
}

/* ---------- Testimonios ---------- */
function renderTestimonios(){
  const t=D.rows.filter(r=>r.testimonial_ok&&r.testimonial_text);
  const box=document.getElementById("testimonios");
  if(!t.length){box.innerHTML=`<div class="empty">${L("A\u00FAn no hay testimonios autorizados.","No authorized testimonials yet.")}</div>`;return;}
  box.innerHTML=t.map(r=>{
    const p=D.profiles[r.user_id];
    const sent=D.tw.find(x=>x.matched_user_id===r.user_id&&x.status!=="withdrawn");
    const tag=sent?`<span class="tag ok">${L("Ya envi\u00F3 el formulario","Form already sent")}</span>`
                  :`<span class="tag warn">${L("Falta el formulario completo","Full form missing")}</span> <button class="btn-ghost" style="padding:3px 9px;font-size:11px;" data-invite="${esc(r.user_id)}">${L("Copiar invitaci\u00F3n","Copy invitation")}</button>`;
    return `<div class="quote">${esc(r.testimonial_text)}<span class="who">${esc(p&&p.full_name?p.full_name:L("Cliente","Client"))}${r.nps!=null?" &middot; NPS "+r.nps:""}</span><div style="margin-top:8px;">${tag}</div></div>`;
  }).join("");
}

document.getElementById("testimonios").addEventListener("click",e=>{const b=e.target.closest("[data-invite]");if(b)twCopyInvite(b.dataset.invite,b);});

/* ---------- Referidos ---------- */
function renderReferidos(){
  const box=document.getElementById("referidos");
  if(!D.refs.length){box.innerHTML=`<div class="empty">${L("A\u00FAn no hay leads referidos.","No referred leads yet.")}</div>`;return;}
  const pend=D.refs.filter(r=>!r.synced_to_crm).length;
  box.innerHTML=`<table><tr><th>${L("Nombre","Name")}</th><th>${L("Contacto","Contact")}</th><th>${L("Refiere","Referred by")}</th><th>CRM</th></tr>`+
    D.refs.map(r=>{
      const p=D.profiles[r.referred_by];
      return `<tr>
        <td>${esc(r.name)}${r.reason?`<div class="muted" style="font-size:11.5px;">${esc(r.reason)}</div>`:""}</td>
        <td class="muted">${esc(r.contact)}</td>
        <td class="muted">${esc(p&&p.full_name?p.full_name:"--")}</td>
        <td>${r.synced_to_crm?`<span class="tag ok">${L("S\u00ED","Yes")}</span>`:`<span class="tag">${L("Pend.","Pend.")}</span>`}</td>
      </tr>`;
    }).join("")+`</table>
    <div style="margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
      <button class="btn-ghost" id="btn-csv" onclick="exportReferidosCSV()"${pend?"":" disabled"}>${L("Exportar CSV","Export CSV")} (${pend} ${L("pend.","pending")})</button>
      <span class="muted" style="font-size:11.5px;">${L("El CRM es otro proyecto Supabase: se importa a mano.","The CRM is a separate Supabase project: import manually.")}</span>
    </div>`;
}

/* Export CSV de los referidos pendientes. Las cabeceras del archivo son
   fijas (nombres de columna de `prospects` del CRM) y NO cambian con el
   idioma, para no romper el mapeo al importar. */
function csvCell(v){
  const s=String(v==null?"":v);
  return /[",;\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
}
async function exportReferidosCSV(){
  const pend=D.refs.filter(r=>!r.synced_to_crm);
  if(!pend.length)return;
  const btn=document.getElementById("btn-csv");
  const cols=["full_name","email","phone","city","country","tags","motivo","referido_por","fecha"];
  const lines=[cols.join(",")];
  pend.forEach(r=>{
    const c=(r.contact||"").trim();
    const isMail=c.includes("@");
    const p=D.profiles[r.referred_by];
    lines.push([
      r.name, isMail?c:"", isMail?"":c, "", "",
      "referido-cliente", r.reason||"",
      (p&&p.full_name)?p.full_name:"",
      (r.created_at||"").slice(0,10)
    ].map(csvCell).join(","));
  });
  /* BOM para que Excel respete los acentos */
  const blob=new Blob(["\uFEFF"+lines.join("\r\n")],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="maat-referidos-"+new Date().toISOString().slice(0,10)+".csv";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);

  if(!confirm(L("Se descargaron ","Downloaded ")+pend.length+L(" referido(s).\n\nMarcarlos como sincronizados al CRM? Dejaran de aparecer como pendientes."," referral(s).\n\nMark them as synced to the CRM? They will stop showing as pending.")))return;
  btn.disabled=true;btn.textContent=L("Marcando...","Marking...");
  const ids=pend.map(r=>r.id);
  const{error}=await sb.from("client_referrals").update({synced_to_crm:true}).in("id",ids);
  if(error){alert(L("No pudimos marcarlos: ","Could not mark them: ")+error.message);btn.disabled=false;return;}
  pend.forEach(r=>{r.synced_to_crm=true;});
  renderKPIs(Object.keys(D.profiles).length);
  renderReferidos();
}

["a-email","a-pass"].forEach(id=>{
  document.getElementById(id).addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});
});
