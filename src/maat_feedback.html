<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>MAAT &mdash; Tu proceso, en tus palabras</title>
<meta name="description" content="Cu&eacute;ntanos c&oacute;mo vas en tu proceso MAAT. Toma 3 minutos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@400;600;700&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --c:#39A1C9; --o:#EBA055; --m:#7DCD93; --v:#896C8E; --r:#D76B6E;
  --paper:#fdfaf6; --paper2:#f5efe6;
  --ink:#2a2030; --ink2:#5a4f5e; --mu:#8a7d8c;
  --bd:rgba(42,32,48,0.10);
  --shadow:0 8px 30px rgba(42,32,48,0.08);
  --shadow-lg:0 20px 60px rgba(42,32,48,0.12);
  --radius:18px; --radius-sm:12px;
  --font-title:'Saira Condensed',sans-serif;
  --font-body:'Sora',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font-body);background:var(--paper);color:var(--ink);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;padding:24px 16px 64px;}
.wrap{max-width:620px;margin:0 auto;}
.head{text-align:center;margin:12px 0 28px;}
.logo{width:64px;height:64px;border-radius:16px;margin:0 auto 16px;display:block;object-fit:cover;box-shadow:0 6px 24px rgba(42,32,48,0.10);}
.eyebrow{font-family:var(--font-title);font-size:13px;font-weight:700;letter-spacing:3px;color:var(--c);text-transform:uppercase;margin-bottom:8px;}
.head h1{font-family:var(--font-title);font-size:clamp(28px,6vw,40px);font-weight:700;line-height:1.1;color:var(--ink);}
.head h1 em{font-style:italic;color:var(--v);}
.head p{color:var(--ink2);font-size:15px;margin-top:10px;}
.card{background:#fff;border:1px solid var(--bd);border-radius:var(--radius);padding:32px 28px;box-shadow:var(--shadow);margin-bottom:20px;}
.hidden{display:none!important;}

/* Language toggle */
.lang-toggle{position:fixed;top:14px;right:14px;display:flex;gap:2px;background:var(--paper2);border:1px solid var(--bd);border-radius:20px;padding:3px;z-index:20;box-shadow:var(--shadow);}
.lang-toggle button{border:none;background:transparent;font-family:var(--font-title);font-size:12px;font-weight:700;letter-spacing:1px;color:var(--mu);padding:5px 11px;border-radius:16px;cursor:pointer;}
.lang-toggle button.on{background:var(--v);color:#fff;}

/* Auth */
.field{margin-bottom:16px;}
.field label{display:block;font-family:var(--font-title);font-size:12px;letter-spacing:1.5px;color:var(--mu);text-transform:uppercase;margin-bottom:8px;font-weight:600;}
.field input{width:100%;padding:14px 16px;background:var(--paper);border:1.5px solid var(--bd);border-radius:var(--radius-sm);font-family:var(--font-body);font-size:16px;color:var(--ink);outline:none;transition:border-color .2s,background .2s;}
.field input:focus{border-color:var(--c);background:#fff;}
.field input.err{border-color:var(--r);background:rgba(215,107,110,.04);}
.btn{width:100%;padding:16px;background:var(--v);color:#fff;border:none;border-radius:var(--radius-sm);font-family:var(--font-title);font-size:16px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:transform .2s,background .2s;}
.btn:hover{transform:translateY(-2px);background:var(--c);}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}
.err-box{background:rgba(215,107,110,.1);color:var(--r);padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none;}
.err-box.show{display:block;}
.note{text-align:center;font-size:12px;color:var(--mu);margin-top:16px;line-height:1.5;}

/* Moment bar */
.moment-bar{display:flex;gap:8px;margin-bottom:24px;background:var(--paper2);padding:6px;border-radius:var(--radius-sm);}
.moment-bar button{flex:1;padding:12px 8px;border:none;background:transparent;border-radius:9px;font-family:var(--font-title);font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--mu);cursor:pointer;font-weight:600;transition:all .2s;}
.moment-bar button.active{background:#fff;color:var(--v);box-shadow:var(--shadow);}
.moment-hint{font-size:13px;color:var(--ink2);background:var(--paper2);border-left:3px solid var(--c);padding:12px 16px;border-radius:0 10px 10px 0;margin-bottom:24px;}

/* Ilustracion papercut por momento (traen fondo propio: van enmarcadas) */
.moment-illo{text-align:center;margin-bottom:20px;}
.moment-illo img{width:100%;max-width:300px;border-radius:16px;box-shadow:var(--shadow);display:block;margin:0 auto;}
.success-illo{width:120px;height:120px;object-fit:cover;border-radius:20px;box-shadow:var(--shadow);margin:0 auto 18px;display:none;}

/* Question */
.q{margin-bottom:28px;padding-bottom:24px;border-bottom:1px dashed var(--bd);}
.q:last-child{border-bottom:none;}
.q-title{font-family:var(--font-title);font-size:19px;color:var(--ink);font-weight:600;margin-bottom:4px;line-height:1.25;}
.q-sub{font-size:13.5px;color:var(--ink2);margin-bottom:14px;}
.scale{display:flex;gap:6px;flex-wrap:wrap;}
.scale button{flex:1;min-width:34px;aspect-ratio:1/1;border:1.5px solid var(--bd);background:var(--paper);border-radius:10px;font-family:var(--font-title);font-size:16px;font-weight:600;color:var(--ink2);cursor:pointer;transition:all .15s;}
.scale button:hover{border-color:var(--c);}
.scale button.sel{background:var(--v);border-color:var(--v);color:#fff;transform:scale(1.05);}
.scale-anchors{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mu);margin-top:8px;font-family:var(--font-title);letter-spacing:.5px;text-transform:uppercase;}
.q textarea{width:100%;padding:12px 14px;background:var(--paper);border:1.5px solid var(--bd);border-radius:var(--radius-sm);font-family:var(--font-body);font-size:15px;color:var(--ink);outline:none;resize:vertical;min-height:64px;margin-top:6px;}
.q textarea:focus{border-color:var(--c);background:#fff;}
.section-label{font-family:var(--font-title);font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--c);font-weight:700;margin:8px 0 18px;}

/* Referrals / checkbox */
.ref-block{background:var(--paper2);border-radius:var(--radius-sm);padding:18px;margin-bottom:14px;}
.ref-block .field{margin-bottom:12px;}
.ref-block .field:last-child{margin-bottom:0;}
.check-row{display:flex;align-items:flex-start;gap:12px;margin:6px 0 14px;cursor:pointer;}
.check-row input{width:20px;height:20px;margin-top:2px;accent-color:var(--v);flex-shrink:0;}
.check-row span{font-size:14px;color:var(--ink2);}

/* Success */
.success{text-align:center;padding:16px 0;}
.success .check{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,var(--m),var(--c));color:#fff;font-size:40px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;box-shadow:0 12px 30px rgba(125,205,147,.3);}
.success h3{font-family:var(--font-title);font-size:26px;color:var(--ink);margin-bottom:10px;}
.success p{font-size:15px;color:var(--ink2);max-width:420px;margin:0 auto 12px;}
.topbar{display:flex;justify-content:flex-end;margin-bottom:8px;}
.topbar button{background:none;border:none;color:var(--mu);font-size:12px;font-family:var(--font-title);letter-spacing:1px;text-transform:uppercase;cursor:pointer;}
@media (max-width:600px){.card{padding:24px 18px;}.scale button{min-width:28px;font-size:14px;}}
</style>
</head>
<body>
<div class="lang-toggle" id="lang-toggle"></div>
<div class="wrap">

  <div class="head">
    <img class="logo" src="https://somosmaat.org/wp-content/uploads/2026/02/Fav-icon-1.png" alt="MAAT">
    <div class="eyebrow" id="s-eyebrow"></div>
    <h1 id="s-h1"></h1>
    <p id="s-head-p"></p>
  </div>

  <!-- AUTH -->
  <div class="card" id="auth-card">
    <div class="err-box" id="auth-err"></div>
    <div class="field">
      <label for="a-email" id="lbl-email"></label>
      <input type="email" id="a-email" autocomplete="email">
    </div>
    <div class="field">
      <label for="a-pass" id="lbl-pass"></label>
      <input type="password" id="a-pass" autocomplete="current-password">
    </div>
    <button class="btn" id="a-btn" onclick="doLogin()"></button>
    <p class="note" id="s-auth-note"></p>
  </div>

  <!-- SURVEY -->
  <div id="survey-card" class="hidden">
    <div class="topbar"><button id="btn-logout" onclick="doLogout()"></button></div>
    <div class="card">
      <div class="moment-bar" id="moment-bar"></div>
      <div class="moment-illo" id="moment-illo"></div>
      <div class="moment-hint" id="moment-hint"></div>
      <div class="err-box" id="survey-err"></div>
      <div id="questions"></div>
      <div id="extra"></div>
      <button class="btn" id="s-btn" onclick="submitSurvey()"></button>
      <p class="note" id="s-survey-note"></p>
    </div>
  </div>

  <!-- SUCCESS -->
  <div id="success-card" class="hidden">
    <div class="card">
      <div class="success">
        <img class="success-illo" id="succ-illo" alt="" onerror="this.style.display='none'">
        <div class="check" id="succ-check">&#10003;</div>
        <h3 id="succ-title"></h3>
        <p id="succ-body"></p>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const CONFIG={
  SUPABASE_URL:"https://pcclptmojjzqmfmzftot.supabase.co",
  SUPABASE_ANON_KEY:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBjY2xwdG1vamp6cW1mbXpmdG90Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4OTg3MjAsImV4cCI6MjA4NzQ3NDcyMH0.VuFBEy19fgNN5pSp_r8p2ZVViniunKdVW7Hy3AmqJXE"
};
const sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});

/* ---------- i18n (comparte la clave maat-lang con la app MAAT) ---------- */
let lang=localStorage.getItem("maat-lang")||"es";
function L(es,en){return lang==="es"?es:en;}
function setLang(l){
  lang=l;localStorage.setItem("maat-lang",l);
  renderLangToggle();applyStaticI18N();
  if(!document.getElementById("survey-card").classList.contains("hidden")){renderMomentBar();renderSurvey();}
}
function renderLangToggle(){
  document.getElementById("lang-toggle").innerHTML=
    `<button class="${lang==="es"?"on":""}" onclick="setLang('es')">ES</button>`+
    `<button class="${lang==="en"?"on":""}" onclick="setLang('en')">EN</button>`;
}
function setTxt(id,txt){const e=document.getElementById(id);if(e)e.textContent=txt;}
function applyStaticI18N(){
  document.documentElement.lang=lang;
  setTxt("s-eyebrow",L("Tu proceso MAAT","Your MAAT process"));
  document.getElementById("s-h1").innerHTML=L("C\u00F3mo vas, <em>en tus palabras</em>","How you\u2019re doing, <em>in your words</em>");
  setTxt("s-head-p",L("Un momento honesto contigo. No hay respuestas correctas.","An honest moment with yourself. There are no wrong answers."));
  setTxt("lbl-email",L("Tu correo","Your email"));
  setTxt("lbl-pass",L("Tu contrase\u00F1a","Your password"));
  document.getElementById("a-email").placeholder=L("tu@correo.com","you@email.com");
  document.getElementById("a-pass").placeholder=L("La misma de tu app MAAT","The same as your MAAT app");
  setTxt("a-btn",L("Entrar","Sign in"));
  setTxt("s-auth-note",L("Usa el mismo correo y contrase\u00F1a con los que entras a tu app MAAT.","Use the same email and password you use for your MAAT app."));
  setTxt("btn-logout",L("Cerrar sesi\u00F3n","Sign out"));
  setTxt("s-survey-note",L("Tus respuestas son parte de tu proceso. Solo t\u00FA y tu mentor las ven.","Your answers are part of your process. Only you and your mentor see them."));
}

/* Estado */
const STATE={user:null,profile:null,moment:null,answers:{},existing:{},refsLocked:false};

/* Dimensiones nucleo (se repiten en los 3 momentos) */
const CORE=[
  {k:"actitud",   es:{t:"Actitud hacia la vida",  s:"En las \u00FAltimas 2 semanas, mi actitud general hacia la vida ha sido...", lo:"Muy negativa", hi:"Muy positiva"},
                  en:{t:"Attitude toward life",    s:"In the last 2 weeks, my general attitude toward life has been...",     lo:"Very negative",hi:"Very positive"}},
  {k:"claridad",  es:{t:"Claridad",               s:"Tengo claridad sobre lo que quiero y hacia d\u00F3nde voy.",                 lo:"Nada claro",   hi:"Total claridad"},
                  en:{t:"Clarity",                s:"I have clarity about what I want and where I am going.",                lo:"None",         hi:"Total clarity"}},
  {k:"confianza", es:{t:"Confianza en m\u00ED mismo",  s:"Conf\u00EDo en mi capacidad para lograr lo que me propongo.",                lo:"Nada",         hi:"Plena"},
                  en:{t:"Confidence in myself",   s:"I trust my ability to achieve what I set out to do.",                   lo:"None",         hi:"Full"}},
  {k:"energia",   es:{t:"Energ\u00EDa",                s:"La energ\u00EDa con la que afronto mis d\u00EDas es...",                          lo:"Muy baja",     hi:"Muy alta"},
                  en:{t:"Energy",                 s:"The energy with which I face my days is...",                            lo:"Very low",     hi:"Very high"}}
];
/* Sub-ejes de entorno (radar) */
const ENTORNO=[
  {k:"ent_profesional",   es:"Profesional / trabajo",          en:"Professional / work"},
  {k:"ent_relaciones",    es:"Relaciones / v\u00EDnculos",          en:"Relationships / bonds"},
  {k:"ent_familiar",      es:"Familiar",                       en:"Family"},
  {k:"ent_intrapersonal", es:"Contigo mismo (intrapersonal)",  en:"With yourself (intrapersonal)"}
];

const MOMENTS={
  inicio:     {es:{label:"Inicio",     hint:"Esta es tu <b>l\u00EDnea base</b>. Responde seg\u00FAn c\u00F3mo te sientes hoy, al empezar el proceso. No busques la 'mejor' respuesta \u2014 busca la verdadera."},
               en:{label:"Start",      hint:"This is your <b>baseline</b>. Answer based on how you feel today, as you begin the process. Don't look for the 'best' answer \u2014 look for the true one."}},
  intermedio: {es:{label:"Intermedio", hint:"Vamos a mitad de camino. Esto nos ayuda a <b>ajustar</b> lo que necesites para la segunda mitad."},
               en:{label:"Midpoint",   hint:"We're halfway through. This helps us <b>adjust</b> whatever you need for the second half."}},
  final:      {es:{label:"Cierre",     hint:"Cierre del proceso. Compara con honestidad c\u00F3mo llegaste y c\u00F3mo te vas."},
               en:{label:"Closing",    hint:"End of the process. Honestly compare how you arrived and how you're leaving."}}
};

/* Ilustraciones papercut (WordPress Media). Traen fondo propio -> enmarcadas. */
const IMG_BASE="https://somosmaat.org/wp-content/uploads/2026/08/";
const MOMENT_IMG={inicio:IMG_BASE+"Sunrise.png",intermedio:IMG_BASE+"waves.png",final:IMG_BASE+"circles.png"};
const SUCCESS_IMG=IMG_BASE+"flower.png";

function suggestMoment(week){
  const w=parseInt(week,10);
  if(!w||w<=4) return "inicio";
  if(w<=12) return "intermedio";
  return "final";
}

/* ---------- Helpers UI ---------- */
function showErr(id,msg){const el=document.getElementById(id);el.textContent=msg;el.classList.add("show");}
function clrErr(id){document.getElementById(id).classList.remove("show");}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function show(id){document.getElementById(id).classList.remove("hidden");}
function hide(id){document.getElementById(id).classList.add("hidden");}

/* ---------- Auth ---------- */
async function doLogin(){
  clrErr("auth-err");
  const email=document.getElementById("a-email").value.trim().toLowerCase();
  const pass=document.getElementById("a-pass").value;
  if(!email||!pass){showErr("auth-err",L("Escribe tu correo y contrase\u00F1a.","Enter your email and password."));return;}
  const btn=document.getElementById("a-btn");btn.disabled=true;btn.textContent=L("Entrando...","Signing in...");
  try{
    const{data,error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error){showErr("auth-err",L("Correo o contrase\u00F1a incorrectos.","Incorrect email or password."));btn.disabled=false;btn.textContent=L("Entrar","Sign in");return;}
    await loadUser();
  }catch(e){
    showErr("auth-err",L("Algo sali\u00F3 mal. Intenta de nuevo.","Something went wrong. Try again."));btn.disabled=false;btn.textContent=L("Entrar","Sign in");
  }
}
async function doLogout(){
  try{await sb.auth.signOut();}catch(_){}
  location.reload();
}

async function loadUser(){
  const{data:{user}}=await sb.auth.getUser();
  if(!user){hide("survey-card");hide("success-card");show("auth-card");return;}
  STATE.user=user;
  const{data:prof}=await sb.from("profiles").select("full_name,current_week,role,preferred_lang").eq("id",user.id).maybeSingle();
  STATE.profile=prof||{};
  /* Idioma preferido del perfil manda (si existe) */
  if(STATE.profile.preferred_lang&&STATE.profile.preferred_lang!==lang){
    lang=STATE.profile.preferred_lang;localStorage.setItem("maat-lang",lang);
    renderLangToggle();applyStaticI18N();
  }
  /* Cargar respuestas existentes de este usuario */
  const{data:rows}=await sb.from("client_feedback").select("*").eq("user_id",user.id);
  STATE.existing={};(rows||[]).forEach(r=>{STATE.existing[r.moment]=r;});
  /* Ya tiene referidos? bloquear para no duplicar */
  const{count}=await sb.from("client_referrals").select("id",{count:"exact",head:true}).eq("referred_by",user.id);
  STATE.refsLocked=(count||0)>0;

  STATE.moment=suggestMoment(STATE.profile.current_week);
  hide("auth-card");hide("success-card");show("survey-card");
  renderMomentBar();
  renderSurvey();
}

/* ---------- Render ---------- */
function renderMomentBar(){
  const bar=document.getElementById("moment-bar");
  bar.innerHTML="";
  Object.keys(MOMENTS).forEach(mk=>{
    const b=document.createElement("button");
    b.textContent=MOMENTS[mk][lang].label+(STATE.existing[mk]?" \u2713":"");
    if(mk===STATE.moment)b.classList.add("active");
    b.onclick=()=>{STATE.moment=mk;STATE.answers={};renderMomentBar();renderSurvey();};
    bar.appendChild(b);
  });
  document.getElementById("moment-hint").innerHTML=MOMENTS[STATE.moment][lang].hint;
  const src=MOMENT_IMG[STATE.moment];
  document.getElementById("moment-illo").innerHTML=src?`<img src="${src}" alt="" loading="lazy" onerror="this.parentNode.style.display='none'">`:"";
}

function scaleHTML(key,min,lo,hi){
  let btns="";
  for(let i=min;i<=10;i++){btns+=`<button type="button" data-k="${key}" data-v="${i}">${i}</button>`;}
  return `<div class="scale" data-scale="${key}">${btns}</div>
          <div class="scale-anchors"><span>${esc(lo)}</span><span>${esc(hi)}</span></div>`;
}

function qBlock(title,sub,key,min,lo,hi){
  return `<div class="q">
    <div class="q-title">${esc(title)}</div>
    ${sub?`<div class="q-sub">${esc(sub)}</div>`:""}
    ${scaleHTML(key,min===undefined?1:min,lo||"1",hi||"10")}
  </div>`;
}

function renderSurvey(){
  clrErr("survey-err");
  const ex=STATE.existing[STATE.moment]||{};
  const qc=document.getElementById("questions");
  let html="";
  CORE.forEach(d=>{const t=d[lang];html+=qBlock(t.t,t.s,d.k,1,t.lo,t.hi);});
  html+=`<div class="section-label">${L("Tu entorno hoy (1 = muy insatisfecho, 10 = pleno)","Your environment today (1 = very unsatisfied, 10 = fulfilled)")}</div>`;
  const entLo=L("Muy insatisfecho","Very unsatisfied"),entHi=L("Pleno","Fulfilled");
  ENTORNO.forEach(d=>{html+=qBlock(d[lang],"",d.k,1,entLo,entHi);});
  html+=`<div class="q">
      <div class="q-title">${L("Una frase","One sentence")}</div>
      <div class="q-sub">${L("Describe en una frase c\u00F3mo te sientes hoy respecto a tu vida.","Describe in one sentence how you feel about your life today.")}</div>
      <textarea id="f-open" placeholder="${L("Escribe con tus palabras...","Write in your own words...")}">${esc(ex.open_text||"")}</textarea>
    </div>`;
  qc.innerHTML=html;

  /* Extra segun momento */
  let extra="";
  if(STATE.moment!=="inicio"){
    extra+=`<div class="q">
        <div class="q-title">${L("Satisfacci\u00F3n con la mentor\u00EDa","Satisfaction with the mentorship")}</div>
        <div class="q-sub">${L("\u00BFQu\u00E9 tan satisfecho est\u00E1s con el proceso hasta ahora?","How satisfied are you with the process so far?")}</div>
        ${scaleHTML("satisfaccion",1,L("Nada","Not at all"),L("Totalmente","Completely"))}
      </div>
      <div class="q">
        <div class="q-title">${L("\u00BFQu\u00E9 faltar\u00EDa para un 10?","What would make it a 10?")}</div>
        <textarea id="f-mejora" placeholder="${L("Lo que mejorar\u00EDas o necesitas...","What you'd improve or need...")}">${esc(ex.mejora_text||"")}</textarea>
      </div>`;
  }
  if(STATE.moment==="final"){
    extra+=`<div class="section-label">${L("Cierre","Closing")}</div>
      <div class="q">
        <div class="q-title">${L("\u00BFNos recomendar\u00EDas?","Would you recommend us?")}</div>
        <div class="q-sub">${L("Del 0 al 10, \u00BFqu\u00E9 tan probable es que recomiendes MAAT a alguien como t\u00FA?","From 0 to 10, how likely are you to recommend MAAT to someone like you?")}</div>
        ${scaleHTML("nps",0,L("Nada probable","Not at all likely"),L("Segur\u00EDsimo","Absolutely"))}
      </div>
      <div class="q">
        <div class="q-title">${L("Testimonio","Testimonial")}</div>
        <label class="check-row"><input type="checkbox" id="f-testok"><span>${L("Autorizo a MAAT a usar mi frase de cierre como testimonio.","I authorize MAAT to use my closing words as a testimonial.")}</span></label>
        <textarea id="f-testtext" placeholder="${L("Si quieres, deja aqu\u00ED tu frase de cierre...","If you'd like, leave your closing words here...")}">${esc(ex.testimonial_text||"")}</textarea>
      </div>`;
    if(STATE.refsLocked){
      extra+=`<div class="q"><div class="q-title">${L("Recomendaciones","Referrals")}</div><div class="q-sub">${L("Ya registramos tus recomendaciones. \u00A1Gracias!","We already recorded your referrals. Thank you!")}</div></div>`;
    }else{
      extra+=`<div class="q">
        <div class="q-title">${L("\u00BFQui\u00E9n m\u00E1s lo necesita?","Who else needs this?")}</div>
        <div class="q-sub">${L("Piensa en 2 personas a las que este proceso les cambiar\u00EDa la vida. Nos acercaremos con respeto de tu parte.","Think of 2 people whose lives this process would change. We'll reach out respectfully on your behalf.")}</div>
        ${refBlock(1)}${refBlock(2)}
      </div>`;
    }
  }
  document.getElementById("extra").innerHTML=extra;

  /* Pre-cargar selecciones existentes */
  STATE.answers={};
  [...CORE,...ENTORNO].forEach(d=>{if(ex[d.k]!=null)setScale(d.k,ex[d.k]);});
  if(ex.satisfaccion!=null)setScale("satisfaccion",ex.satisfaccion);
  if(ex.nps!=null)setScale("nps",ex.nps);
  if(ex.testimonial_ok)document.getElementById("f-testok").checked=true;

  /* Delegacion de clicks en escalas */
  document.querySelectorAll(".scale").forEach(sc=>{
    sc.addEventListener("click",e=>{
      const b=e.target.closest("button[data-k]");if(!b)return;
      setScale(b.dataset.k,parseInt(b.dataset.v,10));
    });
  });
  document.getElementById("s-btn").textContent=STATE.existing[STATE.moment]?L("Actualizar mis respuestas","Update my answers"):L("Guardar mis respuestas","Save my answers");
}

function refBlock(n){
  return `<div class="ref-block">
    <div class="field"><label>${L("Persona","Person")} ${n} &middot; ${L("nombre","name")}</label><input type="text" id="ref${n}-name" placeholder="${L("Nombre y apellido","Full name")}"></div>
    <div class="field"><label>${L("Correo o WhatsApp","Email or WhatsApp")}</label><input type="text" id="ref${n}-contact" placeholder="${L("correo o +57...","email or +1...")}"></div>
    <div class="field"><label>${L("\u00BFPor qu\u00E9 crees que lo necesita?","Why do you think they need it?")}</label><input type="text" id="ref${n}-reason" placeholder="${L("En una l\u00EDnea","In one line")}"></div>
  </div>`;
}

function setScale(key,val){
  STATE.answers[key]=val;
  const sc=document.querySelector(`.scale[data-scale="${key}"]`);if(!sc)return;
  sc.querySelectorAll("button").forEach(b=>{b.classList.toggle("sel",parseInt(b.dataset.v,10)===val);});
}

/* ---------- Submit ---------- */
async function submitSurvey(){
  clrErr("survey-err");
  const a=STATE.answers;
  const missing=[...CORE,...ENTORNO].filter(d=>a[d.k]==null);
  if(missing.length){showErr("survey-err",L("Te faltan algunas preguntas por responder.","You still have some questions to answer."));return;}
  if(STATE.moment!=="inicio"&&a.satisfaccion==null){showErr("survey-err",L("Falta tu nivel de satisfacci\u00F3n.","Your satisfaction level is missing."));return;}
  if(STATE.moment==="final"&&a.nps==null){showErr("survey-err",L("Falta tu nivel de recomendaci\u00F3n.","Your recommendation level is missing."));return;}

  const btn=document.getElementById("s-btn");btn.disabled=true;const prev=btn.textContent;btn.textContent=L("Guardando...","Saving...");
  try{
    const row={
      user_id:STATE.user.id,
      moment:STATE.moment,
      week:STATE.profile.current_week||null,
      actitud:a.actitud,claridad:a.claridad,confianza:a.confianza,energia:a.energia,
      ent_profesional:a.ent_profesional,ent_relaciones:a.ent_relaciones,
      ent_familiar:a.ent_familiar,ent_intrapersonal:a.ent_intrapersonal,
      open_text:(document.getElementById("f-open")||{}).value?document.getElementById("f-open").value.trim():null
    };
    if(STATE.moment!=="inicio"){
      row.satisfaccion=a.satisfaccion;
      const mj=document.getElementById("f-mejora");row.mejora_text=mj&&mj.value.trim()?mj.value.trim():null;
    }
    if(STATE.moment==="final"){
      row.nps=a.nps;
      row.testimonial_ok=!!(document.getElementById("f-testok")||{}).checked;
      const tt=document.getElementById("f-testtext");row.testimonial_text=tt&&tt.value.trim()?tt.value.trim():null;
    }
    const{error}=await sb.from("client_feedback").upsert(row,{onConflict:"user_id,moment"});
    if(error){showErr("survey-err",L("No pudimos guardar: ","Could not save: ")+error.message);btn.disabled=false;btn.textContent=prev;return;}

    /* Referidos (solo final y si no estaban bloqueados) */
    if(STATE.moment==="final"&&!STATE.refsLocked){
      const refs=[];
      [1,2].forEach(n=>{
        const nm=(document.getElementById("ref"+n+"-name")||{}).value;
        const ct=(document.getElementById("ref"+n+"-contact")||{}).value;
        if(nm&&nm.trim()&&ct&&ct.trim()){
          refs.push({
            referred_by:STATE.user.id,
            name:nm.trim(),contact:ct.trim(),
            reason:((document.getElementById("ref"+n+"-reason")||{}).value||"").trim()||null
          });
        }
      });
      if(refs.length){
        const{error:rErr}=await sb.from("client_referrals").insert(refs);
        if(!rErr)STATE.refsLocked=true;
      }
    }
    showSuccess();
  }catch(e){
    showErr("survey-err",L("Algo sali\u00F3 mal. Intenta de nuevo.","Something went wrong. Try again."));btn.disabled=false;btn.textContent=prev;
  }
}

function showSuccess(){
  const name=(STATE.profile.full_name||"").split(" ")[0]||"";
  const msgs={
    inicio:L("Registramos tu punto de partida. Nos vemos dentro del proceso.","We recorded your starting point. See you inside the process."),
    intermedio:L("Gracias por tu honestidad. Con esto ajustamos lo que necesites para la segunda mitad.","Thank you for your honesty. With this we'll adjust whatever you need for the second half."),
    final:L("Gracias por confiar y por caminar este proceso. Tu voz cierra el c\u00EDrculo.","Thank you for trusting and walking this process. Your voice closes the circle.")
  };
  hide("survey-card");
  const illo=document.getElementById("succ-illo");
  illo.src=SUCCESS_IMG;illo.style.display="block";
  document.getElementById("succ-check").style.display="none";
  document.getElementById("succ-title").textContent=(name?name+", ":"")+L("\u00A1listo! \u2728","done! \u2728");
  document.getElementById("succ-body").textContent=msgs[STATE.moment]||L("Respuestas guardadas.","Answers saved.");
  show("success-card");
}

/* Enter en login */
["a-email","a-pass"].forEach(id=>{
  document.getElementById(id).addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});
});

/* Init */
renderLangToggle();
applyStaticI18N();
loadUser();
</script>
</body>
